name: Release

# Builds and tests the installer on every pull request and on every push to main.
# A push to main also publishes a release when pyproject.toml carries a version that has
# no tag yet. To release: raise the version and add docs/releases/vX.Y.Z.md in a pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Read the version and decide whether this run publishes
        id: version
        shell: pwsh
        run: |
          $project = Get-Content -Raw pyproject.toml
          if ($project -notmatch '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"') { throw 'No version = "X.Y.Z" in pyproject.toml' }
          $version = $Matches[1]
          $package = Get-Content -Raw src/vr_gyro_screen/__init__.py
          if ($package -notmatch [regex]::Escape("__version__ = `"$version`"")) { throw "__version__ differs from $version" }
          $tag = "v$version"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the tags' }
          $isNew = -not $existing
          if ($isNew -and -not (Test-Path -LiteralPath "docs/releases/$tag.md")) { throw "The release notes docs/releases/$tag.md are missing" }
          $publish = $isNew -and $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main'
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version, new: $isNew, publish: $publish"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --version="6.7.1" --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco could not install Inno Setup' }
      # The same library versions the released installer was tested with. The gamepad package
      # opens the installer of its driver while it installs and waits for a click; the build
      # needs only its library, so that step is skipped.
      - name: Install the libraries and the build tool
        env:
          VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
        run: python -m pip install -r packaging/build-requirements.txt
      - name: Install the program
        run: python -m pip install --no-deps .
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build.ps1
      # Installs for real in a temporary folder, runs the installed program's own check, uninstalls.
      - name: Test the installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $setup = "dist/VRGyroScreen-Setup-v$version.exe"
          $target = Join-Path $env:RUNNER_TEMP 'installed'
          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LANG=en', "/DIR=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "The installer ended with code $($install.ExitCode)" }
          foreach ($file in 'vr-gyro-screen.exe', 'vr-gyro-screen-cli.exe', 'LICENSE.txt', 'THIRD-PARTY-NOTICES.md', 'unins000.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $target $file))) { throw "$file was not installed" }
          }
          & (Join-Path $target 'vr-gyro-screen-cli.exe') check
          if ($LASTEXITCODE -ne 0) { throw 'The installed program failed its own check' }
          $remove = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "The uninstaller ended with code $($remove.ExitCode)" }
          foreach ($attempt in 1..20) {
            if (-not (Test-Path -LiteralPath (Join-Path $target 'vr-gyro-screen-cli.exe'))) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath (Join-Path $target 'vr-gyro-screen-cli.exe')) { throw 'The uninstaller left the program behind' }
      - name: Write the release notes
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          $sums = (Get-Content -Raw dist/SHA256SUMS.txt).Trim()
          $body = (Get-Content -Raw -Encoding utf8 "docs/releases/$tag.md").TrimEnd() + "`n`n## 🔒 Checksum (SHA-256)`n`n``````text`n$sums`n```````n"
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/notes.md'), $body)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/VRGyroScreen-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/notes.md

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: package
      - name: Check the package and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd package
          ls -l
          test "$(ls | sort | tr '\n' ' ')" = "SHA256SUMS.txt VRGyroScreen-Setup-v$VERSION.exe notes.md "
          sha256sum --check SHA256SUMS.txt
          gh release create "v$VERSION" "VRGyroScreen-Setup-v$VERSION.exe" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "VR Gyro Screen v$VERSION" --notes-file notes.md

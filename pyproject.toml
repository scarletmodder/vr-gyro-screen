[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vr-gyro-screen"
version = "0.1.1"
description = "Flat PC games on a big screen inside a VR headset, with the controllers as a motion sensor gamepad"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyopenxr>=1.1.4501",
    "PyOpenGL>=3.1.7",
    "glfw>=2.7",
    "vgamepad>=0.1.0",
    "pyside6-essentials>=6.8",
]

[project.optional-dependencies]
dxcam = ["dxcam>=0.0.5", "numpy>=1.26"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
vr-gyro-screen = "vr_gyro_screen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vr_gyro_screen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["private", "work", "local"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
platform = "win32"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["xr.*", "OpenGL.*", "vgamepad.*", "dxcam.*", "glfw.*"]
ignore_missing_imports = true
follow_imports = "skip"
